<svg width="760" height="220" viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, Fira Code, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="760" height="220" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="760" height="220" fill="#0d1117"/>

    <!-- title bar -->
    <rect x="0" y="0" width="760" height="34" fill="#161b22"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="17" r="6" fill="#27c93f"/>
    <text x="380" y="22" fill="#8b949e" font-size="12" text-anchor="middle">eduardarf15@sobre-mim: ~</text>

    <!-- terminal body -->
    <text x="24" y="64" font-size="15" fill="#7ee787">eduardarf15</text>
    <text x="120" y="64" font-size="15" fill="#8b949e">:</text>
    <text x="128" y="64" font-size="15" fill="#79c0ff">~</text>
    <text x="140" y="64" font-size="15" fill="#8b949e">$ whoami</text>

    <text x="24" y="94" font-size="20" fill="#facb48" font-weight="600">
      eduarda
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.2s" fill="freeze"/>
    </text>
    <text x="150" y="94" font-size="16" fill="#8b949e">— she/her</text>

    <text x="24" y="128" font-size="15" fill="#7ee787">dev_eduardarf</text>
    <text x="120" y="130" font-size="15" fill="#8b949e">:</text>
    <text x="128" y="130" font-size="15" fill="#79c0ff">~</text>
    <text x="140" y="128" font-size="15" fill="#8b949e">$ ig</text>

    <text x="24" y="158" font-size="16" fill="#e6edf3">
      dev fullstack &amp; cibersegurança 
    </text>
    <text x="24" y="182" font-size="16" fill="#e6edf3">
      - m.eduardarf15@gmail.com
    </text>

    <!-- blinking cursor -->
    <rect x="24" y="192" width="9" height="16" fill="#facb48">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="759" height="219" rx="12" ry="12" fill="none" stroke="#30363d"/>
</svg>
