<svg width="760" height="300" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="winGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3f9"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd3ea"/>
      <stop offset="100%" stop-color="#e6cbff"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#c98fd9" flood-opacity="0.35"/>
    </filter>

    <clipPath id="clipRow1"><rect x="26" y="62" width="0" height="26"><animate attributeName="width" values="0;700" dur="1.1s" begin="masterAnim.begin+0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="clipRow2"><rect x="26" y="96" width="0" height="26"><animate attributeName="width" values="0;700" dur="1.0s" begin="masterAnim.begin+1.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="clipRow3"><rect x="26" y="146" width="0" height="26"><animate attributeName="width" values="0;700" dur="1.0s" begin="masterAnim.begin+3.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="clipRow4"><rect x="26" y="180" width="0" height="26"><animate attributeName="width" values="0;700" dur="1.7s" begin="masterAnim.begin+4.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="clipRow5"><rect x="26" y="214" width="0" height="26"><animate attributeName="width" values="0;700" dur="1.4s" begin="masterAnim.begin+6.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="clipRow6"><rect x="26" y="248" width="0" height="26"><animate attributeName="width" values="0;700" dur="0.6s" begin="masterAnim.begin+8.2s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- master clock, drives every row's timing so the whole thing loops -->
  <rect id="master" x="0" y="0" width="1" height="1" opacity="0">
    <animate id="masterAnim" attributeName="opacity" values="0;0" dur="12s" begin="0s;masterAnim.end" repeatCount="indefinite"/>
  </rect>

  <!-- window -->
  <rect x="1" y="1" width="758" height="298" rx="16" fill="url(#winGrad)" stroke="#f3b8dc" stroke-width="1" filter="url(#softShadow)"/>
  <path d="M1 39 L1 17 A16 16 0 0 1 17 1 L743 1 A16 16 0 0 1 759 17 L759 39 Z" fill="url(#topGrad)"/>
  <line x1="1" y1="39" x2="759" y2="39" stroke="#f0c6e8" stroke-width="1"/>

  <circle cx="24" cy="20" r="6.5" fill="#ff5ea3"/>
  <circle cx="44" cy="20" r="6.5" fill="#b478f0"/>
  <circle cx="64" cy="20" r="6.5" fill="#ffffff" stroke="#c98fd9" stroke-width="1.5"/>
  <text x="380" y="25" text-anchor="middle" fill="#8a5aa8" font-size="13">eduarda@back-end: ~</text>

  <!-- row 1: whoami -->
  <g clip-path="url(#clipRow1)">
    <text x="26" y="80" font-size="17">
      <tspan fill="#ff3d94">eduarda@back-end</tspan>
      <tspan fill="#c9a3de"> :~$ </tspan>
      <tspan fill="#4b2760">whoami</tspan>
    </text>
  </g>

  <!-- row 2: identity output -->
  <g clip-path="url(#clipRow2)">
    <text x="26" y="114" font-size="17">
      <tspan fill="#9333ea" font-weight="bold">eduardarf15</tspan>
      <tspan fill="#c9a3de">  —  </tspan>
      <tspan fill="#0d9488">she/her</tspan>
    </text>
  </g>

  <!-- row 3: role -->
  <g clip-path="url(#clipRow3)">
    <text x="26" y="164" font-size="17">
      <tspan fill="#ff3d94">eduarda@back-end</tspan>
      <tspan fill="#c9a3de"> :~$ </tspan>
      <tspan fill="#4b2760">cargo</tspan>
    </text>
  </g>

  <!-- row 4: role output line 1 -->
  <g clip-path="url(#clipRow4)">
    <text x="26" y="198" font-size="17" fill="#4b2760">Estudante Técnica em <tspan fill="#d9970c">Dev. de Sistemas</tspan></text>
  </g>

  <!-- row 5: role output line 2 -->
  <g clip-path="url(#clipRow5)">
    <text x="26" y="232" font-size="17" fill="#4b2760">Back-end Developer <tspan fill="#c9a3de">@</tspan> <tspan fill="#0d9488">Focus Tech</tspan></text>
  </g>

  <!-- row 6: next prompt + blinking cursor -->
  <g clip-path="url(#clipRow6)">
    <text x="26" y="266" font-size="17">
      <tspan fill="#ff3d94">eduarda@back-end</tspan>
      <tspan fill="#c9a3de"> :~$ </tspan>
    </text>
    <rect x="216" y="252" width="9" height="17" fill="#9333ea">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.001;0.05;0.55;0.6;1" dur="1s" begin="masterAnim.begin+8.8s" repeatCount="3" fill="freeze"/>
    </rect>
  </g>
</svg>
